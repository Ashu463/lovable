# Clarification questions and their answers. Resolvers: ../modules/question.ts

"An answer as it is stored — keyed by question id. See AgentAnswerInput for the shape the agent consumes."
input AnswerQuestionInput {
  questionId: ID!
  answer: String!
}

type Question {
  id: ID!
  projectId: ID!
  runId: ID!
  question: String!
  options: [String!]!
  createdAt: DateTime!
  clarification: Answer
}

type Answer {
  id: ID!
  runId: ID!
  questionId: ID!
  questionText: String!
  answer: String
  createdAt: DateTime!
  answeredAt: DateTime
}

extend type Project {
  questions: [Question!]!
}

extend type Query {
  "Unanswered clarification questions for a project."
  questions(projectId: ID!): [Question!]!
  "Every answered clarification question for a project, oldest first — how a later run recovers answers given in an earlier round."
  answeredQuestions(projectId: ID!): [Answer!]!
}

extend type Mutation {
  answerQuestions(
    projectId: ID!
    runId: ID!
    answers: [AnswerQuestionInput!]!
  ): [Answer!]!
}
